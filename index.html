<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本企業向けメールテンプレート</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: #2a2a2a;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        h2 {
            color: #e0e0e0;
            font-size: 1.4rem;
            margin-bottom: 0.6rem;
            text-align: center;
        }
        .panel {
            background: #3a3a3a;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .section {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .section-title {
            font-size: 0.9rem;
            color: #667eea;
            font-weight: 500;
            margin-bottom: 0.3rem;
        }
        .field {
            display: grid;
            grid-template-columns: 140px 1fr;
            align-items: center;
            gap: 0.5rem;
            min-height: 40px;
        }
        .field-label {
            font-size: 0.85rem;
            color: #aaa;
        }
        .field-input {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .multi-input {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .multi-input input:not([type="checkbox"]) {
            flex: 1;
            /* min-width: 60px; */
        }
        .tooltip {
            position: relative;
            display: inline-block;
            margin-left: 0.3rem;
            cursor: help;
        }
        .tooltip-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            background: #667eea;
            color: #fff;
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .tooltip-text {
            visibility: hidden;
            background: #667eea;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 0.5rem;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            font-size: 0.75rem;
            line-height: 1.4;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #667eea transparent transparent transparent;
        }
        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        input, textarea {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.95rem;
            padding: 0.5rem;
            border: 1px solid #555;
            border-radius: 4px;
            background: #1a1a1a;
            color: #e0e0e0;
            width: 100%;
            transition: border-color 0.3s ease;
        }
        input:hover, textarea:hover {
            border-color: #667eea;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        input::placeholder, textarea::placeholder {
            color: #666;
        }
        #customPurpose {
            display: none;
        }
        textarea {
            resize: vertical;
            min-height: 90px;
        }
        .radio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }
        .radio-group {
            display: flex;
            gap: 1rem;
            flex-direction: column;
        }
        .radio-group-row {
            flex-direction: row;
        }
        .radio-group-row .radio-option {
            flex-direction: row;
            align-items: center;
        }
        .radio-option {
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
            color: #e0e0e0;
            font-size: 0.9rem;
            cursor: pointer;
            flex-direction: column;
        }
        .radio-option-header {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        input[type="radio"],
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid #555;
            background: #2a2a2a;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            margin: 0;
            flex-shrink: 0;
        }
        input[type="radio"] {
            border-radius: 50%;
        }
        input[type="checkbox"] {
            border-radius: 4px;
        }
        input[type="radio"]:hover,
        input[type="checkbox"]:hover {
            border-color: #667eea;
        }
        input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
        }
        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 2px;
        }
        input[type="radio"]:focus,
        input[type="checkbox"]:focus {
            outline: none;
            border-color: #667eea;
        }
        input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .radio-label {
            font-weight: 500;
        }
        .radio-context {
            font-size: 0.75rem;
            color: #888;
            margin-left: 1.5rem;
        }
        .header-section {
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 1.5rem;
            border-radius: 8px;
            border: 2px solid #4a4a4a;
            cursor: pointer;
            transition: transform 0.1s ease;
            position: relative;
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .header-section:active {
            transform: scale(0.99);
        }
        .header-section.show-tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #4ade80;
            color: #1a1a1a;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3);
            opacity: 1;
            animation: fadeInOut 1.5s ease;
            z-index: 10;
        }
        .header-grid {
            display: grid;
            grid-template-columns: 60px 1fr;
            gap: 0.6rem;
            align-items: center;
        }
        .header-grid-label {
            font-size: 0.85rem;
            color: #aaa;
        }
        .header-grid-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e0e0e0;
            padding-left: 1.5rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .preview-label {
            font-size: 0.8rem;
            color: #888;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }
        .hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: 0.3rem;
        }
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            .field {
                grid-template-columns: 1fr;
            }
            .field-label {
                padding-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左パネル：入力フォーム -->
        <div class="panel">
            <h2>メール情報入力</h2>
            
            <!-- 宛名・件名（ヘッダー情報） -->
            <div class="section">
                <div class="section-title">メールヘッダー情報</div>
                
                <div class="field">
                    <label class="field-label">メールの目的</label>
                    <div class="field-input">
                        <div class="radio-grid">
                            <label class="radio-option">
                                <div class="radio-option-header">
                                    <input type="radio" name="purpose" value="【ご連絡】">
                                    <span>【ご連絡】</span>
                                </div>
                            </label>
                            <label class="radio-option">
                                <div class="radio-option-header">
                                    <input type="radio" name="purpose" value="【ご相談】">
                                    <span>【ご相談】</span>
                                </div>
                            </label>
                            <label class="radio-option">
                                <div class="radio-option-header">
                                    <input type="radio" name="purpose" value="【ご確認】">
                                    <span>【ご確認】</span>
                                </div>
                            </label>
                            <label class="radio-option">
                                <div class="radio-option-header">
                                    <input type="radio" name="purpose" value="【ご依頼】">
                                    <span>【ご依頼】</span>
                                </div>
                            </label>
                            <label class="radio-option">
                                <div class="radio-option-header">
                                    <input type="radio" name="purpose" value="【ご返信】">
                                    <span>【ご返信】</span>
                                </div>
                            </label>
                            <label class="radio-option">
                                <div class="radio-option-header">
                                    <input type="radio" name="purpose" value="【書類提出】">
                                    <span>【書類提出】</span>
                                </div>
                            </label>
                            <label class="radio-option">
                                <div class="radio-option-header">
                                    <input type="radio" name="purpose" value="custom" checked>
                                    <span>【カスタム】</span>
                                </div>
                            </label>

                        </div>
                        <input type="text" id="customPurpose" placeholder="例: ご報告">
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">件名</label>
                    <div class="field-input">
                        <input type="text" id="subject" placeholder="例: エントリー">
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">件名の形式</label>
                    <div class="field-input">
                        <div class="radio-group radio-group-row">
                            <label class="radio-option">
                                <input type="radio" name="subjectFormat" value="の件" checked>
                                <span>〜の件</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="subjectFormat" value="について">
                                <span>〜について</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="subjectFormat" value="につきまして">
                                <span>〜につきまして</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">差出人 (自分の氏名)</label>
                    <div class="field-input">
                        <div class="multi-input">
                            <input type="text" id="senderLastName" placeholder="例: 山田">
                            <input type="text" id="senderFirstName" placeholder="例: 太郎">
                            <label style="display: flex; align-items: center; gap: 0.3rem; color: #e0e0e0; font-size: 0.9rem; cursor: pointer; white-space: nowrap;">
                                <input type="checkbox" id="isInternational">
                                <span>留学生</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">自己紹介の形式</label>
                    <div class="field-input">
                        <div class="radio-group radio-group-row">
                            <label class="radio-option">
                                <input type="radio" name="introduction" value="です。" checked>
                                <span>〜です。</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="introduction" value="と申します。">
                                <span>〜と申します。</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="introduction" value="でございます。">
                                <span>〜でございます。</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">宛先 / 担当者名</label>
                    <div class="field-input">
                        <div class="multi-input">
                            <input type="text" id="recipientLastName" placeholder="例: 田中">
                            <input type="text" id="recipientFirstName" placeholder="例: 太郎">
                        </div>
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">
                        CC
                        <span class="tooltip">
                            <span class="tooltip-icon">?</span>
                            <span class="tooltip-text">Carbon Copy<br>メールを見ている受信者<br>同士がお互いに見える</span>
                        </span>
                    </label>
                    <div class="field-input">
                        <div class="multi-input">
                            <input type="text" id="cc1" placeholder="例: 山田花子">
                            <input type="text" id="cc2" placeholder="例: 佐藤次郎">
                            <input type="text" id="cc3" placeholder="例: 鈴木一郎">
                        </div>
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">
                        BCC
                        <span class="tooltip">
                            <span class="tooltip-icon">?</span>
                            <span class="tooltip-text">Blind Carbon Copy<br>メールを見ている受信者<br>同士はお互いに見えない</span>
                        </span>
                    </label>
                    <div class="field-input">
                        <div class="multi-input">
                            <input type="text" id="bcc1" placeholder="例: 高橋健太">
                            <input type="text" id="bcc2" placeholder="例: 伊藤美咲">
                            <input type="text" id="bcc3" placeholder="例: 渡辺直樹">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 本文 -->
            <div class="section">
                <div class="section-title">本文</div>
                
                <div class="field">
                    <label class="field-label">会社名</label>
                    <div class="field-input">
                        <div class="multi-input">
                            <input type="text" id="company" placeholder="例: 株式会社〇〇〇〇">
                            <input type="text" id="companyDepartment" placeholder="例: 人事部">
                        </div>
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">挨拶</label>
                    <div class="field-input">
                        <div class="radio-group radio-group-row">
                            <label class="radio-option">
                                <input type="radio" name="greeting" value="お世話になっております。" checked>
                                <span>お世話になっております。</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="greeting" value="お忙しいところ失礼いたします。">
                                <span>お忙しいところ失礼いたします。</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">学校名</label>
                    <div class="field-input">
                        <div class="multi-input">
                            <input type="text" id="schoolName" placeholder="例: 千葉大学">
                            <input type="text" id="schoolDepartment" placeholder="例: 工学部">
                        </div>
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">学校種別</label>
                    <div class="field-input">
                        <div class="radio-group radio-group-row">
                            <label class="radio-option">
                                <input type="radio" name="schoolType" value="専門学校" checked>
                                <span>専門学校</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="schoolType" value="大学">
                                <span>大学</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">メール本文</label>
                    <div class="field-input">
                        <textarea id="bodyContent" placeholder="例: この度は、貴社のインターンシップ募集に大変興味があり、ぜひ参加させていただきたく存じます。"></textarea>
                        <!-- この度は、インターンシップ募集のご案内をいただき、誠にありがとうございます。&#10;貴社のAI技術への取り組みに強い関心を持っており、ぜひ参加させていただきたく存じます。 -->
                        <div class="hint">メインの内容を記入してください</div>
                    </div>
                </div>
            </div>

            <!-- 結び -->
            <div class="section">
                <div class="section-title">結びの言葉</div>
                <div class="radio-group">
                    <label class="radio-option">
                        <div class="radio-option-header">
                            <input type="radio" name="closing" value="よろしくお願い申し上げます。" checked>
                            <span class="radio-label">よろしくお願い申し上げます。</span>
                        </div>
                        <span class="radio-context">一般的な依頼・お願いの場合</span>
                    </label>
                    <label class="radio-option">
                        <div class="radio-option-header">
                            <input type="radio" name="closing" value="ご確認のほどよろしくお願い申し上げます。">
                            <span class="radio-label">ご確認のほどよろしくお願い申し上げます。</span>
                        </div>
                        <span class="radio-context">確認を依頼する場合</span>
                    </label>
                    <label class="radio-option">
                        <div class="radio-option-header">
                            <input type="radio" name="closing" value="ありがとうございました。">
                            <span class="radio-label">ありがとうございました。</span>
                        </div>
                        <span class="radio-context">感謝を伝える場合</span>
                    </label>
                    <label class="radio-option">
                        <div class="radio-option-header">
                            <input type="radio" name="closing" value="引き続き、何卒よろしくお願い申し上げます。">
                            <span class="radio-label">引き続き、何卒よろしくお願い申し上げます。</span>
                        </div>
                        <span class="radio-context">継続的な関係の場合</span>
                    </label>
                </div>
            </div>

            <!-- 署名 -->
            <div class="section">
                <div class="section-title">署名</div>

                <div class="field">
                    <label class="field-label">住所</label>
                    <div class="field-input">
                        <input type="text" id="address" placeholder="例: 東京都千代田区1-2-3">
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">電話番号</label>
                    <div class="field-input">
                        <input type="text" id="tel" placeholder="例: 090-1234-5678">
                    </div>
                </div>
                
                <div class="field">
                    <label class="field-label">メールアドレス</label>
                    <div class="field-input">
                        <input type="text" id="email" placeholder="例: yamada@mail.com">
                    </div>
                </div>
            </div>
        </div>

        <!-- 右パネル：プレビュー -->
        <div class="panel">
            <h2>メールプレビュー</h2>
            
            <!-- ヘッダー情報プレビュー -->
            <div class="preview-label">ヘッダー情報（クリックしてコピー）</div>
            <div class="header-grid">
                <div class="header-grid-label">件名:</div>
                <div id="subjectPreview" class="header-section"></div>
                
                <div class="header-grid-label">差出人:</div>
                <div id="senderPreview" class="header-grid-content"></div>
                
                <div class="header-grid-label">宛先:</div>
                <div id="recipientPreview" class="header-grid-content"></div>
                
                <div id="ccRow" style="display: contents;">
                    <div class="header-grid-label">CC:</div>
                    <div id="ccPreview" class="header-grid-content"></div>
                </div>
                
                <div id="bccRow" style="display: contents;">
                    <div class="header-grid-label">BCC:</div>
                    <div id="bccPreview" class="header-grid-content"></div>
                </div>
            </div>
            
            <!-- メール本文プレビュー -->
            <div class="preview-label">メール本文（クリックしてコピー）</div>
            <div id="preview" class="header-section"></div>

            <!-- 署名プレビュー -->
            <div class="preview-label">署名（クリックしてコピー）</div>
            <div id="signaturePreview" class="header-section"></div>
        </div>
    </div>

    <script>
        'use strict';

        const State = {
            isCopyInProgress: false
        };

        function toggleCustomPurpose() {
            const customRadio = document.querySelector('input[name="purpose"][value="custom"]');
            const customInput = document.getElementById('customPurpose');
            
            if (customRadio.checked) {
                customInput.style.display = 'block';
            } else {
                customInput.style.display = 'none';
                customInput.value = ''; // Очищаем при скрытии
            }
        }

        // 宛先名フィールドをロック/ロック解除する
        function updateRecipientFirstNameState() {
            const lastNameInput = document.getElementById('recipientLastName');
            const firstNameInput = document.getElementById('recipientFirstName');
            
            if (lastNameInput.value.trim() === '') {
                firstNameInput.disabled = true;
                firstNameInput.value = ''; // Очищаем поле при блокировке
                firstNameInput.placeholder = '最初に姓を入力してください';
            } else {
                firstNameInput.disabled = false;
                firstNameInput.placeholder = '例: 太郎';
            }
        }

        function updatePreview() {
            // ヘッダー情報
            const senderLastName = document.getElementById('senderLastName').value || '△△';
            const senderFirstName = document.getElementById('senderFirstName').value || '〇〇';
            const isInternational = document.getElementById('isInternational').checked;
            
            // 差出人の名前の組み立て（ヘッダー用）
            let senderHeader;
            if (isInternational) {
                senderHeader = `${senderLastName}　${senderFirstName}`;
            } else {
                senderHeader = `${senderLastName}${senderFirstName}`;
            }
            
            // 本文で使う名前（留学生の場合はFirstNameのみ）
            const senderName = isInternational ? senderFirstName : senderLastName;
            
            const recipientLastName = document.getElementById('recipientLastName').value;
            const recipientFirstName = document.getElementById('recipientFirstName').value;

            // Формируем имя получателя
            let recipient;
            if (recipientLastName && recipientFirstName) {
                // Введены и фамилия, и имя
                recipient = `${recipientLastName}${recipientFirstName}`;
            } else if (recipientLastName) {
                // Только фамилия
                recipient = recipientLastName;
            } else if (recipientFirstName) {
                // Только имя
                recipient = recipientFirstName;
            } else {
                // Ничего не введено - показываем плейсхолдер
                recipient = '▽▽〇〇';
            }
            
            const cc1 = document.getElementById('cc1').value;
            const cc2 = document.getElementById('cc2').value;
            const cc3 = document.getElementById('cc3').value;
            const ccList = [cc1, cc2, cc3].filter(v => v).join('様、');
            
            const bcc1 = document.getElementById('bcc1').value;
            const bcc2 = document.getElementById('bcc2').value;
            const bcc3 = document.getElementById('bcc3').value;
            const bccList = [bcc1, bcc2, bcc3].filter(v => v).join('様、');
            
            // メールの目的
            const purposeRadio = document.querySelector('input[name="purpose"]:checked').value;
            let purpose = '';
            if (purposeRadio === 'custom') {
                const customPurpose = document.getElementById('customPurpose').value;
                if (customPurpose) {
                    purpose = `【${customPurpose}】`;
                }
            } else {
                purpose = purposeRadio;
            }
            
            const subjectBase = document.getElementById('subject').value || '〇〇';
            const subjectFormat = document.querySelector('input[name="subjectFormat"]:checked').value;
            const subject = purpose ? `${purpose}${subjectBase}${subjectFormat}` : `${subjectBase}${subjectFormat}`;
            
            // 本文
            const company = document.getElementById('company').value || '〇〇〇〇';
            const companyDepartment = document.getElementById('companyDepartment').value;
            const greeting = document.querySelector('input[name="greeting"]:checked').value;
            const schoolName = document.getElementById('schoolName').value || '〇〇';
            const schoolDepartment = document.getElementById('schoolDepartment').value;
            const schoolType = document.querySelector('input[name="schoolType"]:checked').value;
            const introduction = document.querySelector('input[name="introduction"]:checked').value;
            const bodyContent = document.getElementById('bodyContent').value || '（用件を簡潔）につきましてご連絡いたしました。\n（本文の内容をここに記載）';
            const closing = document.querySelector('input[name="closing"]:checked').value;
            
            // 署名
            const address = document.getElementById('address').value;
            const tel = document.getElementById('tel').value || '000-0000-0000';
            const email = document.getElementById('email').value || 'xxxx@mail.com';

            // ヘッダープレビュー（分割）
            document.getElementById('subjectPreview').textContent = subject;
            document.getElementById('senderPreview').textContent = senderHeader;
            document.getElementById('recipientPreview').textContent = `${recipient}様`;
            // CC
            document.getElementById('ccRow').style.display = ccList ? 'contents' : 'none';
            if (ccList) document.getElementById('ccPreview').textContent = `${ccList}様`;
            // BCC
            document.getElementById('bccRow').style.display = bccList ? 'contents' : 'none';
            if (bccList) document.getElementById('bccPreview').textContent = `${bccList}様`;
            
            // 本文プレビュー
            let emailText = '';
            emailText += `株式会社${company}\n`;
            if (companyDepartment) emailText += `${companyDepartment}\n`;
            emailText += `${recipientLastName || '▽▽'}様\n\n`;
            emailText += `${greeting}\n`;
            
            let schoolInfo = `${schoolName}${schoolType}`;
            if (schoolDepartment) schoolInfo += `　${schoolDepartment}`;
            
            emailText += `${schoolInfo}の${senderName}${introduction}\n\n`;
            emailText += `${bodyContent}\n\n`;
            emailText += `${closing}`;

            document.getElementById('preview').textContent = emailText;

            // 署名プレビュー
            let signatureText = '';
            signatureText += `${schoolName}${schoolType}\n`;
            if (schoolDepartment) signatureText += `${schoolDepartment}\n`;
            if (address) signatureText += `${address}\n`;
            signatureText += `TEL：${tel}\n`;
            signatureText += `Mail：${email}\n`;
            signatureText += `${senderLastName}　${senderFirstName}`;

            document.getElementById('signaturePreview').textContent = signatureText;
        }

        async function copyToClipboard(element) {
            if (State.isCopyInProgress) return;
            
            State.isCopyInProgress = true;
            
            try {
                await navigator.clipboard.writeText(element.textContent);
                
                element.setAttribute('data-tooltip', 'コピーしました！');
                element.classList.add('show-tooltip');
                
                setTimeout(() => {
                    element.classList.remove('show-tooltip');
                    setTimeout(() => {
                        element.removeAttribute('data-tooltip');
                    }, 200);
                }, 1500);
                
            } catch (error) {
                console.error('コピーエラー:', error);
            } finally {
                State.isCopyInProgress = false;
            }
        }

        // イベントリスナー設定
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.addEventListener('input', updatePreview);
            });

            document.querySelectorAll('input[name="closing"], input[name="schoolType"], input[name="introduction"], input[name="subjectFormat"], input[name="greeting"]').forEach(radio => {
                radio.addEventListener('change', updatePreview);
            });
            
            // 留学生チェックボックス
            document.getElementById('isInternational').addEventListener('change', updatePreview);

            document.getElementById('subjectPreview').addEventListener('click', function() {
                copyToClipboard(this);
            });
            
            document.getElementById('preview').addEventListener('click', function() {
                copyToClipboard(this);
            });

            document.getElementById('signaturePreview').addEventListener('click', function() {
                copyToClipboard(this);
            });

            document.getElementById('recipientLastName').addEventListener('input', function() {
                updateRecipientFirstNameState();
                updatePreview();
            });

            document.querySelectorAll('input[name="purpose"]').forEach(radio => {
                radio.addEventListener('change', toggleCustomPurpose);
            });

            // 初期表示
            toggleCustomPurpose();
            updateRecipientFirstNameState();
            updatePreview();
        });
    </script>
</body>
</html>
